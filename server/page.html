<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-sounds</title>
<style>
:root { --bg:#f5f5f2; --fg:#1b1b1b; --card:#fff; --muted:#666; --line:#dcdcd6; --acc:#2a62c9; --bad:#b3261e; --warn:#9a6700; --ok:#1e7a3c; --chip:#eef0f4; }
@media (prefers-color-scheme: dark) { :root { --bg:#151618; --fg:#e7e7e7; --card:#202124; --muted:#9a9a9a; --line:#36383c; --acc:#6c9eff; --bad:#ff8a80; --warn:#e3b341; --ok:#5fd38a; --chip:#2b2d31; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); }
header h1 { font-size:18px; margin:0; } header .status { color:var(--muted); font-size:12px; } header a { color:var(--acc); font-size:13px; }
main { display:grid; grid-template-columns:360px 1fr; gap:16px; padding:16px; max-width:1500px; margin:0 auto; }
@media (max-width:900px) { main { grid-template-columns:1fr; } }
.panel, .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
.panel h2 { font-size:14px; margin:14px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.panel h2:first-child { margin-top:0; }
label { display:block; font-size:12px; color:var(--muted); margin:6px 0 2px; }
input, select, textarea, button { font:inherit; color:var(--fg); }
input, select, textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); }
textarea { resize:vertical; min-height:58px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.check { display:flex; gap:6px; align-items:center; margin-top:8px; font-size:13px; color:var(--fg); }
.check input { width:auto; }
button { padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); cursor:pointer; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
button:disabled { opacity:.5; cursor:wait; }
.btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.preview { font-size:12px; color:var(--muted); margin-top:6px; white-space:pre-wrap; word-break:break-word; }
.takes { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:12px; }
@media (max-width:500px) { .takes { grid-template-columns:1fr; } }
.card.rejected { opacity:.6; }
.card h3 { margin:0 0 4px; font-size:15px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
.chip { background:var(--chip); border-radius:12px; padding:1px 8px; font-size:12px; }
.chip.bad { color:var(--bad); } .chip.ok { color:var(--ok); }
.warn { color:var(--warn); font-size:12px; } .fail { color:var(--bad); font-size:12px; font-weight:600; }
.card img { width:100%; border-radius:6px; margin-top:6px; cursor:zoom-in; }
.card audio { width:100%; margin-top:6px; }
.reqhead { margin-bottom:10px; } .reqhead .prompt { color:var(--muted); font-size:12px; }
.history { font-size:12px; max-height:220px; overflow:auto; }
.history div { padding:3px 0; cursor:pointer; border-bottom:1px dashed var(--line); } .history div:hover { color:var(--acc); }
.small { font-size:12px; color:var(--muted); }
#msg { margin:8px 0; font-size:13px; } #msg.err { color:var(--bad); }
#tip { position:fixed; z-index:50; max-width:320px; background:var(--fg); color:var(--bg); padding:6px 9px; border-radius:6px; font-size:12px; pointer-events:none; opacity:0; transition:opacity .12s; }
#tip.on { opacity:.95; }
dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); max-width:420px; }
dialog::backdrop { background:rgba(0,0,0,.35); }
.layer { display:grid; grid-template-columns:auto 70px 80px; gap:6px; align-items:center; font-size:12px; margin-top:4px; }
.layer input { padding:3px 5px; }
#big { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; z-index:60; }
#big img { max-width:96vw; max-height:94vh; } #big.on { display:flex; }
</style>
</head>
<body>
<header>
  <h1>local-sounds</h1>
  <span class="status" id="status">connecting...</span>
  <a href="/bakeoff/" data-tip="The blind A/B comparison of the two engines (if scripts/bakeoff.py has been run).">bake-off</a>
</header>
<main>
<section class="panel" id="panel">
  <h2>Sound</h2>
  <textarea id="text" placeholder="sword hit on a shield" data-tip="What you want, tersely: one sound event. The category recipe adds envelope and recording words. Ctrl+Enter generates."></textarea>
  <div class="preview" id="preview"></div>
  <div class="row">
    <div><label>Engine</label><select id="engine" data-tip="sa3: Stable Audio 3 Small-SFX (44.1 kHz stereo, 8 steps, fast; ignores the negative prompt and CFG). moss: MOSS-SoundEffect v2 (48 kHz mono, 100 steps, slower; uses the negative prompt).">
      <option value="sa3">sa3 (Stable Audio 3)</option><option value="moss">moss (MOSS v2)</option></select></div>
    <div><label>Category</label><select id="category" data-tip="The prompt recipe and UCS file category. Auto picks it from the words."><option value="">auto</option></select></div>
  </div>
  <div class="row3">
    <div><label>Mode</label><select id="mode" data-tip="oneshot: trimmed so the hit lands at t=0, mono, peak -1 dBTP. ambience: stereo, -23 LUFS. loop: a seamless loop of exactly the duration."><option value="">auto</option><option>oneshot</option><option>ambience</option><option>loop</option></select></div>
    <div><label>Duration s</label><input id="duration" type="number" step="0.1" min="0.05" max="120" placeholder="auto" data-tip="One-shots: the most it may last (trimmed to the sound). Ambiences and loops: exactly this long."></div>
    <div><label>Takes (N)</label><input id="n" type="number" min="1" max="16" data-tip="Best-of-N: this many seeds are generated, checked and ranked."></div>
  </div>
  <div class="row3">
    <div><label>Seed</label><input id="seed" placeholder="random" data-tip="Start seed: takes use seed, seed+1, ... Empty = random. The same seed and prompt give the same sound."></div>
    <div><label>FPS</label><input id="fps" type="number" step="0.001" min="1" max="240" data-tip="Frame rate for alignment, padding to whole frames and the plot's grid."></div>
    <div><label>Hit on frame</label><input id="align_frame" type="number" min="0" placeholder="none" data-tip="One-shots: put the transient exactly on this frame (padding in front). Empty: the hit lands at t=0 after a 3 ms pre-roll."></div>
  </div>
  <div class="row">
    <div><label>Reverb</label><select id="reverb" data-tip="Dry by default. room: a small, damped room. hall: medium hall."><option>none</option><option>room</option><option>hall</option></select></div>
    <div><label>Steps</label><input id="steps" type="number" min="1" max="250" placeholder="engine default" data-tip="Sampling steps. Defaults: sa3 8, moss 100."></div>
  </div>
  <label>Negative prompt</label>
  <input id="negative" placeholder="category default" data-tip="What to avoid. Only moss uses it; Stable Audio 3 Small-SFX ignores negative prompts (per Stability's docs).">
  <label class="check" data-tip="Send the text exactly as written, without the category recipe."><input type="checkbox" id="raw"> Raw prompt (no recipe)</label>
  <label class="check" data-tip="CLAP (does it match the prompt?) and Audiobox Aesthetics (production quality) scores. Signal checks always run."><input type="checkbox" id="check"> Model scores</label>
  <label class="check" data-tip="Also describe the best take with the audio captioner (loads a 2.8 GB model for a few seconds; must be downloaded)."><input type="checkbox" id="caption"> Caption the best take</label>
  <div class="btns">
    <button class="primary" id="go" data-tip="Generate N takes, check and rank them (Ctrl+Enter).">Generate</button>
    <button id="save" data-tip="Store these settings in config.local.json: the page and every agent request that leaves them out will use them. Asks first.">Save as my defaults</button>
    <button id="reset" data-tip="Delete config.local.json and go back to the repo's built-in defaults. Asks first.">Reset to built-in</button>
  </div>
  <div id="likebox" class="small"></div>
  <div id="msg"></div>

  <h2>Layers</h2>
  <div class="small" id="layers">Tick "layer" on takes to mix them.</div>
  <div class="btns"><button id="mix" data-tip="Mix the ticked takes: each layer's transient lands at its offset (ms) from the first one's, with its gain, through a limiter.">Mix layers</button></div>

  <h2>Recent</h2>
  <div class="history" id="history"></div>
</section>

<section>
  <div id="result"><p class="small">Ranked takes appear here: listen, compare the scores, look at the spectrograms
  (frame grid, red onset line), then download, vary, or re-process them.</p></div>
</section>
</main>

<div id="tip"></div>
<div id="big"><img alt=""></div>
<dialog id="confirm"><p id="confirmText"></p><div class="btns"><button id="cYes" class="primary">Yes</button><button id="cNo">Cancel</button></div></dialog>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ["engine", "category", "mode", "duration", "n", "seed", "fps", "align_frame", "reverb", "steps", "negative", "raw", "check", "caption"];
let current = null, like = null, layers = {}, settings = null;

// ---------------------------------------------------------------- tooltips (after 1 s)
let tipTimer = null;
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]"); clearTimeout(tipTimer); $("tip").classList.remove("on");
  if (!el) return;
  tipTimer = setTimeout(() => {
    const r = el.getBoundingClientRect(), t = $("tip"); t.textContent = el.dataset.tip;
    t.style.left = Math.min(r.left, innerWidth - 330) + "px"; t.style.top = (r.bottom + 6) + "px"; t.classList.add("on");
  }, 1000);
});
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) { clearTimeout(tipTimer); $("tip").classList.remove("on"); } });

// ---------------------------------------------------------------- helpers
async function api(path, body, method) {
  const r = await fetch(path, {method: method || (body ? "POST" : "GET"), headers: {"Content-Type": "application/json"},
                               body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    let d = j.detail; if (Array.isArray(d)) d = d.map(x => (x.loc || []).slice(1).join(".") + ": " + x.msg).join("; ");
    throw new Error(d || r.statusText);
  }
  return j;
}
function msg(t, err) { $("msg").textContent = t || ""; $("msg").className = err ? "err" : ""; }
function confirmBox(text) {
  return new Promise(res => { $("confirmText").textContent = text; const d = $("confirm"); d.showModal();
    $("cYes").onclick = () => { d.close(); res(true); }; $("cNo").onclick = () => { d.close(); res(false); }; });
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }
function num(id) { const v = $(id).value.trim(); return v === "" ? null : Number(v); }
function busy(on) { document.querySelectorAll("button").forEach(b => b.disabled = on); }

// ---------------------------------------------------------------- settings
function applySettings(eff) {
  $("engine").value = eff.engine; $("n").value = eff.n; $("seed").value = eff.seed ?? "";
  $("fps").value = eff.fps; $("reverb").value = eff.reverb; $("steps").value = eff.steps ?? "";
  $("negative").value = eff.negative ?? ""; $("raw").checked = !!eff.raw; $("check").checked = !!eff.check;
  $("caption").checked = !!eff.caption;
}
function panelSettings() {
  return {engine: $("engine").value, n: num("n"), seed: num("seed"), fps: num("fps"), reverb: $("reverb").value,
          steps: num("steps"), negative: $("negative").value.trim() || null, raw: $("raw").checked,
          check: $("check").checked, caption: $("caption").checked};
}
$("save").onclick = async () => {
  if (!await confirmBox("Save these settings as your defaults (config.local.json)? The page and every agent request that doesn't set them will use them.")) return;
  try { settings = await api("/api/settings", panelSettings()); msg("Saved as your defaults."); } catch (e) { msg(e.message, true); }
};
$("reset").onclick = async () => {
  if (!await confirmBox("Delete your saved defaults and go back to the built-in ones?")) return;
  try { settings = await api("/api/settings", null, "DELETE"); applySettings(settings.effective); msg("Back to the built-in defaults."); } catch (e) { msg(e.message, true); }
};

// ---------------------------------------------------------------- prompt preview
let pvTimer = null;
function preview() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(async () => {
    const t = $("text").value.trim(); if (!t) { $("preview").textContent = ""; return; }
    const q = new URLSearchParams({text: t, raw: $("raw").checked}); if ($("category").value) q.set("category", $("category").value);
    if ($("mode").value) q.set("mode", $("mode").value);
    try { const p = await api("/api/prompt?" + q);
      $("preview").textContent = `→ ${p.prompt}\n${p.category} · ${p.mode} · ${p.duration}s default · ${p.name}`; } catch (e) { $("preview").textContent = e.message; }
  }, 350);
}
["text", "category", "raw", "mode"].forEach(id => $(id).addEventListener("input", preview));

// ---------------------------------------------------------------- generate
async function generate() {
  const text = $("text").value.trim(); if (!text) { msg("Type a sound first.", true); return; }
  const body = {text, engine: $("engine").value, raw: $("raw").checked, check: $("check").checked, caption: $("caption").checked,
                reverb: $("reverb").value};
  for (const k of ["duration", "n", "fps", "align_frame", "steps"]) { const v = num(k); if (v !== null) body[k] = v; }
  const seed = $("seed").value.trim(); body.seed = seed === "" ? null : Number(seed);
  if ($("category").value) body.category = $("category").value;
  if ($("mode").value) body.mode = $("mode").value;
  if ($("negative").value.trim()) body.negative = $("negative").value.trim();
  if (like) body.like = like;
  busy(true); msg("Generating... (moss takes ~15 s a take; sa3 ~1 s)");
  try { show(await api("/api/generate", body)); msg(""); history(); } catch (e) { msg(e.message, true); }
  finally { busy(false); }
}
$("go").onclick = generate;
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) generate(); });

// ---------------------------------------------------------------- results
function chipsFor(t) {
  const c = [`<span class="chip" data-tip="Rank score: CLAP match (cosine + softmax) and Audiobox production quality, minus warnings. Compare takes of the same request only.">score ${t.rank_score?.toFixed(2)}</span>`];
  if (t.clap_cos !== undefined) c.push(`<span class="chip" data-tip="CLAP: cosine similarity of prompt and audio (about 0.1 poor, 0.25 fair, 0.35+ good), and in brackets the softmax of the prompt against distractor captions (music, speech, noise, near misses).">CLAP ${t.clap_cos.toFixed(2)} (${t.clap.toFixed(2)})</span>`);
  if (t.aes?.PQ !== undefined) c.push(`<span class="chip ${t.aes.PQ < 5 ? "bad" : t.aes.PQ >= 7 ? "ok" : ""}" data-tip="Audiobox Aesthetics production quality, 1-10: noise, distortion and artefacts pull it down. Under 4 is rejected.">PQ ${t.aes.PQ.toFixed(1)}</span>`);
  const p = t.post || {};
  if (p.length_s !== undefined) c.push(`<span class="chip" data-tip="Delivered length, and in whole frames at the request's fps.">${p.length_s.toFixed(2)} s · ${p.length_frames} fr</span>`);
  if (p.onset_s !== undefined) c.push(`<span class="chip" data-tip="Where the transient starts in the delivered file (red line on the plot).">onset ${(p.onset_s * 1000).toFixed(0)} ms · fr ${p.onset_frame}</span>`);
  if (p.seam_ok !== undefined) c.push(`<span class="chip ${p.seam_ok ? "ok" : "bad"}" data-tip="Loop seam: how much the end-to-start join stands out from the rest of the loop (jump, level and spectral change ratios).">seam ${p.seam_ok ? "ok" : "audible?"}</span>`);
  if (t.final) c.push(`<span class="chip" data-tip="True peak (dBTP) and integrated loudness (LUFS) of the delivered file.">${t.final.true_peak_dbtp} dBTP · ${t.final.lufs} LUFS</span>`);
  return c.join("");
}
function card(rec, t) {
  const fails = (t.fails || []).map(f => `<div class="fail">✗ ${esc(f)}</div>`).join("");
  const warns = (t.warnings || []).map(w => `<div class="warn">! ${esc(w)}</div>`).join("");
  const vars = (t.variations || []).map(v => `<div class="small">v${String(v.version).padStart(2, "0")} <audio controls preload="none" src="/files/${v.file}"></audio></div>`).join("");
  const lay = layers[t.ref];
  return `<div class="card ${t.rejected ? "rejected" : ""}">
    <h3>#${t.rank} <span class="small">seed ${t.seed} · ${esc(t.ref)}</span></h3>
    <div class="chips">${chipsFor(t)}</div>${fails}${warns}
    ${t.caption ? `<div class="small" data-tip="What the captioner heard.">heard: ${esc(t.caption)}</div>` : ""}
    <audio controls preload="none" src="/files/${t.files.wav}?v=${Date.now()}"></audio>
    <img loading="lazy" src="/files/${t.files.png}?v=${Date.now()}" alt="spectrogram" data-tip="Waveform and spectrogram: grey lines are frames, the red line the onset. Click to enlarge.">
    <div class="btns">
      <a href="/files/${t.files.wav}" download><button data-tip="The delivered WAV: 48 kHz 24-bit, INFO chunk with prompt, seed, model and scores.">WAV</button></a>
      <button data-act="like" data-ref="${t.ref}" data-tip="Next generation starts from this take (audio-to-audio, sa3): similar, not identical.">More like this</button>
      <button data-act="seed" data-seed="${t.seed}" data-tip="Put this seed in the panel (with the same prompt, it reproduces this take).">Use seed</button>
      <button data-act="vars" data-ref="${t.ref}" data-tip="Make a round-robin set of 5: v01 is this take, v02-v05 small pitch/speed and EQ changes.">Variations</button>
      <button data-act="cap" data-ref="${t.ref}" data-tip="Ask the audio captioner what this take contains (loads a 2.8 GB model briefly).">Caption</button>
      <label class="check" data-tip="Add this take to the layer mix (left panel)."><input type="checkbox" data-act="layer" data-ref="${t.ref}" ${lay ? "checked" : ""}> layer</label>
    </div>${vars}</div>`;
}
function show(rec) {
  current = rec;
  const p = rec.post || {};
  $("result").innerHTML = `<div class="reqhead card">
      <div><b>${esc(rec.cat_id)}_${esc(rec.name)}</b> <span class="small">${esc(rec.id)} · ${esc(rec.engine)} · ${esc(rec.category)} · ${esc(p.mode)} ·
        ${rec.gen_s !== undefined ? `${rec.takes.length} takes in ${rec.gen_s}s + ${rec.score_s}s checks · ${rec.kept} kept` : ""}</span></div>
      <div class="prompt">${esc(rec.prompt)}</div>
      ${rec.negative ? `<div class="prompt">negative: ${esc(rec.negative)}${(rec.ignored || []).includes("negative") ? " (ignored by this engine)" : ""}</div>` : ""}
      ${(rec.warnings || []).map(w => `<div class="warn">! ${esc(w)}</div>`).join("")}
      <div class="row3" style="margin-top:8px">
        <div><label>Re-process: mode</label><select id="pp_mode"><option>oneshot</option><option>ambience</option><option>loop</option></select></div>
        <div><label>Duration s</label><input id="pp_duration" type="number" step="0.1" value="${p.duration ?? ""}"></div>
        <div><label>Hit on frame</label><input id="pp_align" type="number" min="0" value="${p.align_frame ?? ""}" placeholder="none"></div>
      </div>
      <div class="row3">
        <div><label>FPS</label><input id="pp_fps" type="number" step="0.001" value="${p.fps}"></div>
        <div><label>Reverb</label><select id="pp_reverb"><option>none</option><option>room</option><option>hall</option></select></div>
        <div><label>Pre-roll ms</label><input id="pp_preroll" type="number" step="0.5" value="${p.preroll_ms}"></div>
      </div>
      <div class="btns"><button id="pp_go" data-tip="Re-run trimming, alignment, loudness and reverb on every take of this request from the raw audio: no regeneration.">Re-process</button>
        <button id="pp_del" data-tip="Delete this request's files from output/. Asks first.">Delete request</button></div>
    </div>
    <div class="takes">${rec.takes.map(t => card(rec, t)).join("")}</div>`;
  $("pp_mode").value = p.mode; $("pp_reverb").value = p.reverb;
  $("pp_go").onclick = reprocess;
  $("pp_del").onclick = async () => {
    if (!await confirmBox(`Delete request ${rec.id} and all its files?`)) return;
    try { await api("/api/requests/" + rec.id, null, "DELETE"); $("result").innerHTML = ""; history(); } catch (e) { msg(e.message, true); }
  };
}
async function reprocess() {
  const body = {take: current.takes[0].ref, mode: $("pp_mode").value, fps: num("pp_fps"), reverb: $("pp_reverb").value,
                preroll_ms: num("pp_preroll"), duration: num("pp_duration")};
  Object.keys(body).forEach(k => body[k] === null && delete body[k]);
  body.align_frame = num("pp_align");  // empty sends null: removes an earlier alignment
  busy(true); msg("Re-processing...");
  try { show(await api("/api/post", body)); msg(""); } catch (e) { msg(e.message, true); } finally { busy(false); }
}
$("result").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) { const img = e.target.closest(".card img"); if (img) { $("big").querySelector("img").src = img.src; $("big").classList.add("on"); } return; }
  const act = b.dataset.act, ref = b.dataset.ref;
  if (act === "like") { like = ref; $("likebox").innerHTML = `Next generation: more like <b>${esc(ref)}</b> <button id="unlike">clear</button>`; $("unlike").onclick = () => { like = null; $("likebox").textContent = ""; }; }
  if (act === "seed") { $("seed").value = b.dataset.seed; $("n").value = 1; msg("Seed set (N = 1)."); }
  if (act === "vars") { busy(true); msg("Making variations...");
    try { const t = await api("/api/variations", {take: ref, n: 5}); const i = current.takes.findIndex(x => x.ref === ref); current.takes[i] = {...current.takes[i], variations: t.variations}; show(current); msg(""); }
    catch (err) { msg(err.message, true); } finally { busy(false); } }
  if (act === "cap") { busy(true); msg("Captioning...");
    try { const [c] = await api("/api/caption", {takes: [ref]}); const i = current.takes.findIndex(x => x.ref === ref); current.takes[i].caption = c.caption; show(current); msg(""); }
    catch (err) { msg(err.message, true); } finally { busy(false); } }
  if (act === "layer") { if (b.checked) layers[ref] = {gain_db: 0, offset_ms: 0}; else delete layers[ref]; drawLayers(); }
});
$("big").onclick = () => $("big").classList.remove("on");

// ---------------------------------------------------------------- layers
function drawLayers() {
  const refs = Object.keys(layers);
  $("layers").innerHTML = refs.length ? `<div class="layer small"><span>take</span><span>gain dB</span><span>offset ms</span></div>` +
    refs.map(r => `<div class="layer"><span>${esc(r)}</span><input type="number" step="0.5" value="${layers[r].gain_db}" data-l="${r}" data-k="gain_db"><input type="number" step="1" value="${layers[r].offset_ms}" data-l="${r}" data-k="offset_ms"></div>`).join("")
    : "Tick \"layer\" on takes to mix them.";
}
$("layers").addEventListener("input", e => { const i = e.target; if (i.dataset.l) layers[i.dataset.l][i.dataset.k] = Number(i.value); });
$("mix").onclick = async () => {
  const refs = Object.keys(layers); if (refs.length < 1) { msg("Tick \"layer\" on at least one take.", true); return; }
  busy(true); msg("Mixing...");
  try { show(await api("/api/layer", {layers: refs.map(r => ({take: r, ...layers[r]})), fps: num("fps") || 24})); msg(""); history(); }
  catch (e) { msg(e.message, true); } finally { busy(false); }
};

// ---------------------------------------------------------------- history, status
async function history() {
  try { const h = await api("/api/requests?limit=30");
    $("history").innerHTML = h.map(r => `<div data-id="${r.id}">${esc(r.name)} <span class="small">${esc(r.engine)} · ${r.takes} · ${esc(r.id)}</span></div>`).join("") || "<span class='small'>nothing yet</span>"; } catch (e) {}
}
$("history").addEventListener("click", async e => { const d = e.target.closest("[data-id]"); if (!d) return;
  try { show(await api("/api/requests/" + d.dataset.id)); } catch (err) { msg(err.message, true); } });
async function status() {
  try { const h = await api("/api/health");
    $("status").textContent = `engines: ${Object.entries(h.engines).map(([k, v]) => k + (v ? " ✓" : " –")).join(", ")} · VRAM ${h.vram_used_gb}/${h.vram_total_gb} GB` + (h.busy ? " · busy" : "");
  } catch (e) { $("status").textContent = "server not reachable"; }
}
(async () => {
  try {
    for (const c of await api("/api/categories")) $("category").insertAdjacentHTML("beforeend", `<option value="${c.key}">${c.key} (${c.cat_id})</option>`);
    settings = await api("/api/settings"); applySettings(settings.effective);
  } catch (e) { msg(e.message, true); }
  status(); history(); setInterval(status, 5000);
})();
</script>
</body>
</html>
